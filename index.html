<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Zihin Gazetesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">📰 ZİHİN GAZETESİ</div>
    <div class="tagline">Her gün yeni bir bulmaca.</div>
  </header>

  <main id="app">
    <section class="date-card">
      <h1>📅 Bugünün Bulmacaları</h1>
      <p id="today"></p>
    </section>

    <section class="menu">
      <button class="puzzle-card" data-puzzle="kare">🧩 <span>Kare Bulmaca</span></button>
      <button class="puzzle-card" data-puzzle="sudoku">🔢 <span>Sudoku</span></button>
      <button class="puzzle-card" data-puzzle="kelime">🔤 <span>Kelime Avı</span></button>
      <button class="puzzle-card" data-puzzle="genel">❓ <span>Genel Kültür</span></button>
      <button class="puzzle-card" data-puzzle="zeka">🧠 <span>Zeka Sorusu</span></button>
    </section>

    <section class="history-card">
      <h2>📚 Geçmiş Bulmacalar</h2>
      <p>Geçmiş günlerin bulmacaları burada yer alacak.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
